services:
  backend:
    build: ./backend
    container_name: windvision-backend
    environment:
      ELEXON_BASE_URL: https://data.elexon.co.uk/bmrs/api/v1
      DEFAULT_DECISION_MONTH: 2026-01
      DEFAULT_CUTOFF_TIME: "10:00"
      CACHE_TTL_SECONDS: 600
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: windvision-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
